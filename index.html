<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Visits</title>
<meta name="theme-color" content="#14100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visits">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14100d;--card:#1f1915;--card2:#2a221c;--line:rgba(255,255,255,.08);--txt:#f4ece2;--mut:#a8998b;--acc:#e2aa6c;--grn:#58d68d;--blue:#7cb8ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:5;background:rgba(20,16,13,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
  header .wrap{display:flex;align-items:center;gap:10px}
  h1{font-family:Fraunces,serif;font-size:1.5rem;margin:0;flex:1}
  .live{font-size:.75rem;color:var(--mut);display:flex;align-items:center;gap:6px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 0 rgba(88,214,141,.6);animation:p 2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 7px rgba(88,214,141,0)}100%{box-shadow:0 0 0 0 rgba(88,214,141,0)}}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chip{flex:none;font:inherit;font-size:.85rem;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--acc);color:#1b130d;border-color:var(--acc)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-family:Fraunces,serif;font-size:1.6rem;line-height:1.1}
  .stat span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .bars h3{margin:0 0 8px;font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.85rem;margin-bottom:7px}
  .bar .tr{grid-column:1/-1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
  .bar .tr i{display:block;height:100%;background:var(--acc);border-radius:3px}
  @media (max-width:560px){ .bars{grid-template-columns:1fr} }
  .day{margin:20px 0 8px;font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
  .visit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
  .visit.me{opacity:.55}
  .row1{display:flex;align-items:center;gap:10px}
  .ico{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:1.25rem;flex:none}
  .who{flex:1;min-width:0}
  .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who span{font-size:.82rem;color:var(--mut)}
  .when{text-align:right;font-size:.8rem;color:var(--mut);flex:none}
  .when b{display:block;color:var(--txt);font-weight:600;font-size:.88rem}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:.78rem;padding:4px 9px;border-radius:8px;background:var(--card2);color:var(--txt)}
  .tag.src{color:var(--blue)} .tag.new{color:var(--grn)} .tag.back{color:var(--acc)} .tag.site{color:var(--mut)}
  .acts{margin-top:9px;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:#d9cdbf}
  .acts div{display:flex;gap:8px} .acts em{font-style:normal;color:var(--mut);flex:none;width:58px}
  .mebtn{margin-left:auto;font:inherit;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
  .empty,.gate{text-align:center;color:var(--mut);padding:60px 20px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;font-size:.82rem;color:var(--mut);flex-wrap:wrap}
  .foot button{font:inherit;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap"><h1>👣 Visits</h1><span class="live"><i></i><span id="upd">loading</span></span></div></header>
<main class="wrap">
  <div class="chips" id="sites"></div>
  <div id="body"></div>
  <div class="foot">
    <button id="meBtn"></button>
    <button id="showMe"></button>
  </div>
</main>
<script>
var API='https://api.jobhubgo.com/api/site-visits/log';
var KEY=(location.hash.match(/k=([a-z0-9]+)/)||[])[1]||'';
var state={site:null, showMe:false, data:null};
try{ state.site=localStorage.getItem('visits-site')||null; state.showMe=localStorage.getItem('visits-showme')==='1' }catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function icon(d){d=d||'';return /iPhone|Android phone/.test(d)?'📱':/iPad|tablet/.test(d)?'📲':/Mac|Windows|Linux|Chromebook/.test(d)?'💻':'🌐'}
function source(r){
  if(!r) return 'Direct or a texted link';
  try{var h=new URL(r).hostname.replace(/^www\./,'')}catch(e){return r}
  if(/facebook|fb\.com|fb\.me/.test(h)) return 'Facebook';
  if(/instagram/.test(h)) return 'Instagram';
  if(/google\./.test(h)) return 'Google';
  if(/bing\./.test(h)) return 'Bing';
  if(/^t\.co$|twitter|x\.com/.test(h)) return 'X';
  if(/achyboy\.github\.io/.test(h)) return /\/links/.test(r)?'Your links page':'Another of your sites';
  return h;
}
function clock(d){return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'})}
function dayKey(d){return d.toLocaleDateString('en-CA',{timeZone:'America/Chicago'})}
function dayLabel(k){
  var t=dayKey(new Date()), y=dayKey(new Date(Date.now()-864e5));
  if(k===t) return 'Today'; if(k===y) return 'Yesterday';
  return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
}
function ago(d){var s=(Date.now()-d)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return Math.floor(s/3600)+' hr ago'; return ''}
function act(e){
  var d=e.detail||'';
  switch(e.kind){
    case 'call': return '📞 Tapped to call '+d;
    case 'directions': return '📍 Directions: '+d;
    case 'facebook': return '👍 Opened Facebook';
    case 'instagram': return '📸 Opened Instagram';
    case 'email': return '✉️ Tapped email';
    case 'drink': return '🧋 Built a drink: '+d;
    case 'music': return d==='off'?'🔇 Turned the music off':'🎷 Music playing';
    case 'nav': return '👆 Tapped "'+d+'"';
    case 'cup': return '✍️ Signed a cup: '+d;
    case 'cheers': return '🥂 Clinked '+d+'\u2019s cup';
    case 'link': return '🔗 Opened '+d;
    default: return e.kind+(d?': '+d:'');
  }
}

function render(){
  var data=state.data; if(!data) return;
  // site chips
  var sc='<button class="chip" data-s="" aria-pressed="'+(!state.site)+'">All sites</button>'+data.sites.map(function(s){
    return '<button class="chip" data-s="'+esc(s.site)+'" aria-pressed="'+(state.site===s.site)+'">'+esc(s.site)+' · '+s.visitors+'</button>'}).join('');
  document.getElementById('sites').innerHTML=sc;

  var ev=data.events.filter(function(e){return (!state.site||e.site===state.site)});
  // group into visits (sessions)
  var by={}, order=[];
  ev.slice().reverse().forEach(function(e){
    var k=e.site+'|'+(e.sid||e.vid||e.id);
    if(!by[k]){by[k]={first:e,events:[],leaveS:0,leaveP:0,me:false};order.push(k)}
    var v=by[k]; v.events.push(e); if(e.is_owner) v.me=true;
    if(!v.view && e.kind==='view') v.view=e;
    if(e.kind==='leave'){var m=(e.detail||'').match(/(\d+)s\|(\d+)%/); if(m){v.leaveS=Math.max(v.leaveS,+m[1]); v.leaveP=Math.max(v.leaveP,+m[2])}}
  });
  // first-ever session per visitor, to flag returning people
  var firstSid={};
  order.forEach(function(k){var v=by[k], id=v.first.vid; if(id&&!firstSid[id+v.first.site]) firstSid[id+v.first.site]=k});
  var visits=order.map(function(k){var v=by[k]; v.key=k; v.isNew=!v.first.vid||firstSid[v.first.vid+v.first.site]===k; return v}).reverse();
  var shown=visits.filter(function(v){return state.showMe||!v.me});

  // stats (not counting you)
  var others=visits.filter(function(v){return !v.me});
  var t=dayKey(new Date()), wk=Date.now()-7*864e5;
  var today=others.filter(function(v){return dayKey(new Date(v.first.at))===t}).length;
  var week=others.filter(function(v){return new Date(v.first.at)>wk});
  var people={}; week.forEach(function(v){people[v.first.vid||v.key]=1});
  var actions=week.reduce(function(n,v){return n+v.events.filter(function(e){return /call|directions|drink|facebook|instagram|email/.test(e.kind)}).length},0);
  var h='<div class="stats">'+
    '<div class="stat"><b>'+today+'</b><span>Visits today</span></div>'+
    '<div class="stat"><b>'+week.length+'</b><span>Visits, 7 days</span></div>'+
    '<div class="stat"><b>'+Object.keys(people).length+'</b><span>People, 7 days</span></div>'+
    '<div class="stat"><b>'+actions+'</b><span>Taps, 7 days</span></div></div>';

  function tally(fn){var m={};week.forEach(function(v){var k=fn(v);if(k)m[k]=(m[k]||0)+1});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5)}
  function barsHtml(title,rows){var max=rows.length?rows[0][1]:1;return '<div><h3>'+title+'</h3>'+(rows.length?rows.map(function(r){return '<div class="bar"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span><span class="tr"><i style="width:'+Math.round(100*r[1]/max)+'%"></i></span></div>'}).join(''):'<div style="color:var(--mut);font-size:.85rem">Nothing yet</div>')+'</div>'}
  if(week.length) h+='<div class="bars">'+barsHtml('Devices',tally(function(v){return (v.view||v.first).device}))+barsHtml('Came from',tally(function(v){return source((v.view||v.first).referrer)}))+'</div>';

  if(!shown.length) h+='<div class="empty">No visits yet. They will show up here within a few seconds of someone opening the site.</div>';
  var lastDay='';
  shown.slice(0,300).forEach(function(v){
    var f=v.view||v.first, d=new Date(v.first.at), dk=dayKey(d);
    if(dk!==lastDay){ h+='<div class="day">'+dayLabel(dk)+'</div>'; lastDay=dk }
    var place=f.geo||(f.tz?f.tz.replace(/^.*\//,'').replace(/_/g,' ')+' time':'');
    var sub=[f.browser,f.os].filter(Boolean).join(' · ');
    var tags='';
    if(!state.site) tags+='<span class="tag site">'+esc(f.site)+'</span>';
    tags+='<span class="tag src">'+esc(source(f.referrer))+'</span>';
    tags+= v.me?'<span class="tag">You</span>':(v.isNew?'<span class="tag new">New visitor</span>':'<span class="tag back">Came back</span>');
    if(v.leaveS) tags+='<span class="tag">⏱ '+(v.leaveS>=60?Math.floor(v.leaveS/60)+'m '+(v.leaveS%60)+'s':v.leaveS+'s')+'</span><span class="tag">↓ '+v.leaveP+'%</span>';
    if(f.screen) tags+='<span class="tag">'+esc(f.screen)+'</span>';
    if(f.vid) tags+='<button class="mebtn" data-vid="'+esc(f.vid)+'" data-me="'+(v.me?'0':'1')+'">'+(v.me?'Not me':'This is me')+'</button>';
    var acts=v.events.filter(function(e){return e.kind!=='view'&&e.kind!=='leave'}).map(function(e){return '<div><em>'+clock(new Date(e.at))+'</em><span>'+esc(act(e))+'</span></div>'}).join('');
    h+='<div class="visit'+(v.me?' me':'')+'"><div class="row1"><div class="ico">'+icon(f.device)+'</div>'+
      '<div class="who"><b>'+esc(f.device||'Unknown device')+(place?' · '+esc(place):'')+'</b><span>'+esc(sub)+'</span></div>'+
      '<div class="when"><b>'+clock(d)+'</b>'+ago(d)+'</div></div>'+
      '<div class="tags">'+tags+'</div>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
  });
  document.getElementById('body').innerHTML=h;
  document.getElementById('upd').textContent='updated '+clock(new Date());
}

function paintButtons(){
  var me=false; try{me=localStorage.getItem('trk-me')==='1'}catch(e){}
  document.getElementById('meBtn').textContent= me?'✓ This device is marked as you':'Mark this device as me';
  document.getElementById('showMe').textContent= state.showMe?'Hide my visits':'Show my visits';
}

function load(){
  if(!KEY){ document.getElementById('body').innerHTML='<div class="gate">This page needs your private link.</div>'; document.getElementById('upd').textContent=''; return; }
  fetch(API+'?limit=3000',{headers:{'x-visits-key':KEY},cache:'no-store'}).then(function(r){
    if(r.status===403) throw new Error('key'); return r.json();
  }).then(function(j){ state.data=j; try{localStorage.setItem('visits-cache',JSON.stringify(j))}catch(e){} render(); })
  .catch(function(e){
    document.getElementById('upd').textContent = e.message==='key' ? 'wrong link' : 'offline, showing saved';
  });
}

document.addEventListener('click',function(e){
  var c=e.target.closest('.chip');
  if(c){ state.site=c.dataset.s||null; try{state.site?localStorage.setItem('visits-site',state.site):localStorage.removeItem('visits-site')}catch(e){} render(); return; }
  var mb=e.target.closest('.mebtn');
  if(mb){
    mb.textContent='Saving…';
    fetch(API.replace('/log','/me'),{method:'POST',headers:{'x-visits-key':KEY,'Content-Type':'text/plain'},body:JSON.stringify({vid:mb.dataset.vid,me:mb.dataset.me==='1'})})
      .then(function(r){ if(!r.ok) throw 0; load(); }).catch(function(){ mb.textContent='Try again'; });
    return;
  }
  if(e.target.id==='meBtn'){ try{ localStorage.getItem('trk-me')==='1'?localStorage.removeItem('trk-me'):localStorage.setItem('trk-me','1') }catch(e){} paintButtons(); }
  if(e.target.id==='showMe'){ state.showMe=!state.showMe; try{localStorage.setItem('visits-showme',state.showMe?'1':'0')}catch(e){} paintButtons(); render(); }
});
try{ var cached=JSON.parse(localStorage.getItem('visits-cache')||'null'); if(cached&&KEY){ state.data=cached; render(); } }catch(e){}
paintButtons(); load(); setInterval(load,30000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') load() });
</script>
</body>
</html>
